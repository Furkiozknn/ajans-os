name: CI

# NEDEN SONRADAN EKLENDI. Depo 142 testle geliyordu ve hepsi yerelde
# geciyordu, ama `.github/workflows/` hic yoktu - yani hicbiri push'ta
# kosmuyordu. Tek CI kosusu GitHub'in kendiliginden ekledigi CodeQL'di.
# 21 Eylul 2026'da test sayisi denetimi bunu "yalnizca test disi akis var
# (CodeQL)" diye bildirdi: README 142 diyordu, dogrulayan yoktu.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kapi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json engines: node >=22. Alt sinir ve guncel surum.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v5

      # U15 kapisi komsu projenin dogrulayicisini kullanir: turetilen ajan
      # dosyasi turkce-ajanlar/arac/dogrula.js --kati'dan gecmeli. Komsu
      # yoksa test KENDINI ATLAR (ADR-002) ve ilk CI kosusunda tam da bu
      # oldu: "# tests 142 / # pass 141 / # skipped 1". Yani baska birinin
      # kabul kapisini olcen tek test, olcmesi gereken yerde hic kosmuyordu.
      #
      # Komsu ayni sahibin PUBLIC deposu ve burada yalnizca DOGRULAYICI
      # olarak kosuyor; ajans-os'un kendi kodu ondan hicbir sey import
      # etmiyor (ADR-002 duruyor). Surum sabitlenmis bir SHA'ya pinli:
      # komsuda yapilan bir degisiklik bu kosuyu kendiliginden degistiremez.
      - name: Komsu dogrulayici (U15)
        uses: actions/checkout@v5
        with:
          repository: Furkiozknn/turkce-ajanlar
          ref: 7e1dbbbacc9aae62ff9a1fa8ea3f8d569cb413e6
          path: _komsu/turkce-ajanlar
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      # Arayuzler (src/**/*.d.ts) tsconfig.json ile tanimliydi ama hicbir yerde
      # tip denetiminden gecmiyordu: bir .d.ts'deki bozuk import ya da yanlis
      # tip adi sessizce kalirdi. TypeScript bagimlilik DEGIL (package.json
      # bos kalir); yalnizca CI'da, surumu sabit, bir kez indirilip kosuyor.
      - name: Arayuz tip denetimi (tsc --noEmit)
        run: npx --yes -p typescript@5.9.3 tsc -p .

      # ADR-009: uygulama da testler de duz ESM, kosucu node:test.
      # Bagimlilik yok, package-lock.json da yok - `npm ci` eklenirse her
      # kosuda "no package-lock.json" ile duser.

      # Kapi zaten package.json'da tanimli: testler + yapi dogrulama +
      # yapi kapisinin kendi testi. CI burada yeni bir komut zinciri
      # uydurmuyor, gelistiricinin yerelde calistirdigi ayni kapiyi kosuyor -
      # boylece ikisi birbirinden kayamaz.
      - name: Kapi (testler + yapi dogrulama)
        env:
          # Testin varsayilani `../turkce-ajanlar` (gelistirme makinesinde iki
          # depo yan yana). CI'da checkout calisma alaninin disina yazamaz,
          # o yuzden yol acikca veriliyor.
          AJANS_OS_KOMSU: ${{ github.workspace }}/_komsu/turkce-ajanlar
        # pipefail SART: `tee` her zaman 0 doner, onsuz DUSEN bir kapi
        # yesil gorunurdu. Actions'in varsayilan kabugu `bash -e` ve
        # pipefail icermiyor, o yuzden acikca veriliyor.
        shell: bash
        run: |
          set -o pipefail
          npm run kapi 2>&1 | tee kapi-ciktisi.txt

      # Sozlesme kapisinin GERCEKTEN kostugunu kanitla. `npm run kapi` zinciri
      # bir gun kisaltilirsa (ya da `sema` betigi package.json'dan dusrulurse)
      # kosu yine yesil kalirdi -- kaybedilen sey, 6 sozlesme semasini ve
      # dogrulayicinin kendi mekanigini tutan tek ag olurdu. Ciktida ariyoruz.
      - name: Sozlesme kapisi kostu mu
        run: |
          set -e
          grep -qE "mutant oldu: her zorlama noktasi gercekten olculuyor" kapi-ciktisi.txt \
            || { echo "HATA: sema-mutasyon.js ciktida gorunmuyor"; exit 1; }
          grep -q "Oz-test — dogrulayicinin kendi mekanigi\|Öz-test — doğrulayıcının kendi mekaniği" kapi-ciktisi.txt \
            || { echo "HATA: sema-dogrula.js --test ciktida gorunmuyor"; exit 1; }
          grep -qE "^[0-9]+ gecti, 0 kaldi" kapi-ciktisi.txt \
            || { echo "HATA: kanit-dogrula-test.js ciktida gorunmuyor"; exit 1; }
          grep -E "gecti, .* atlandi" kapi-ciktisi.txt | tail -1
          echo "Sozlesme kapisi kostu"

      # U15'in GERCEKTEN kostugunu kanitla. Bu adim olmadan komsu checkout'u
      # sessizce bozulabilir (yol degisir, pinli SHA silinir) ve test yine
      # kendini atlar -- kosu YESIL kalir, kapsam kaybi fark edilmez. Tam da
      # bu is akisinin kapatmak icin var oldugu korluk.
      - name: U15 atlanmadi mi
        run: |
          set -e
          # node:test'in ozet satiri KOSUCUNUN RAPORLAYICISINA gore degisiyor:
          # Node 22 TAP basiyor ("# skipped 0"), Node 24 spec basiyor
          # ("<bilgi isareti> skipped 0"). Ilk surum yalnizca '^#' ariyordu,
          # matrisin 24 bacagi bu yuzden dustu -- oysa U15 GECMISTI.
          # Oneke degil satirin kendisine bak.
          ozet() { grep -E "(^|[^a-zA-Z])$1 [0-9]+" kapi-ciktisi.txt | tail -1 || true; }
          if ! grep -qE "(^|[^a-zA-Z])skipped 0( |$)" kapi-ciktisi.txt; then
            echo "HATA: bir test atlandi. U15 komsu dogrulayiciyi bulamamis olabilir."
            for a in tests pass fail skipped; do ozet "$a"; done
            echo "Beklenen yol: $AJANS_OS_KOMSU/arac/dogrula.js"
            ls -la "$AJANS_OS_KOMSU/arac/" || echo "(komsu dizini yok)"
            exit 1
          fi
          # U15'i ADIYLA da ara: "skipped 0" tek basina yeterli degil, test
          # hic kaydedilmemis olsa da o satir yine 0 derdi.
          grep -qE "(ok [0-9]+ - |✔ ).*\(U15\)" kapi-ciktisi.txt \
            || { echo "HATA: U15 testi ciktida hic gorunmuyor"; exit 1; }
          for a in tests pass skipped; do ozet "$a"; done
          echo "U15 dahil butun testler kostu"
        env:
          AJANS_OS_KOMSU: ${{ github.workspace }}/_komsu/turkce-ajanlar
